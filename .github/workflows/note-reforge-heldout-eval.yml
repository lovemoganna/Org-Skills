name: note-reforge Held-out Eval

on:
  push:
    branches:
      - eval/note-reforge-heldout-20261020
    paths:
      - "skills/note-reforge/evals/heldout_openai_eval.py"
      - ".github/workflows/note-reforge-heldout-eval.yml"

permissions:
  contents: write

jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: eval/note-reforge-heldout-20261020

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        run: python -m pip install "openai>=2.0,<3.0" "PyYAML>=6,<7"

      - name: Run sealed held-out A/B subjects
        id: eval
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python skills/note-reforge/evals/heldout_openai_eval.py

      - name: Commit evidence to eval branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/note-reforge/evals/runs/heldout_openai_20261020
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "eval(note-reforge): record held-out subject evidence"
            git push origin HEAD:eval/note-reforge-heldout-20261020
          fi

      - name: Enforce subject-run success
        if: always()
        run: |
          if [ "${{ steps.eval.outcome }}" != "success" ]; then
            echo "Held-out subject run did not complete successfully."
            exit 1
          fi
