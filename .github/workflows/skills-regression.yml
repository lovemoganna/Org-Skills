name: Skills Regression

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "README.md"
      - "plugins/org-museum/**"
      - ".github/workflows/skills-regression.yml"
  pull_request:
    paths:
      - "skills/**"
      - "README.md"
      - "plugins/org-museum/**"
      - ".github/workflows/skills-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run skill integrity checks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t checks < <(find skills -type f -path "*/tests/check_repo.py" | sort)
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "No check_repo.py files found."
            exit 1
          fi
          for check in "${checks[@]}"; do
            echo "==> python $check"
            python "$check"
          done

      - name: Verify Org Museum plugin package and canonical Skill locks
        run: python plugins/org-museum/tests/check_package.py

      - name: Validate Org Museum skills-only distributable
        run: python plugins/org-museum/tests/check_distribution.py

      - name: Catch unprotected literal template variables before Org export
        run: python plugins/org-museum/tests/check_template_macros.py

      - name: Validate portable Org Museum 1.2.2 archive and required metadata
        run: python plugins/org-museum/tests/check_portable_distribution.py

      - name: Run independent Native SQL contract mutation tests
        shell: bash
        run: |
          set -euo pipefail
          python skills/sql-business-thinking/tests/check_native_contract.py
