name: SQL Business Thinking Wasm Retest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sql-business-thinking-wasm-retest.yml"
      - "skills/sql-business-thinking/**"

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current Skill revision
        uses: actions/checkout@v4

      - name: Run SQL Business Thinking integrity
        shell: bash
        run: |
          set -euo pipefail
          python skills/sql-business-thinking/tests/check_repo.py

      - name: Register current gate contract
        shell: bash
        run: |
          set -euo pipefail
          cp skills/sql-business-thinking/tests/mandatory-gates.json mandatory-gates.json
          printf '%s' "$GITHUB_SHA" > skill-revision.txt

      - name: Download original workbook export
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 \
            'https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx' \
            -o workbook.xlsx
          python - <<'PY'
          import os, zipfile
          assert zipfile.is_zipfile("workbook.xlsx"), "Google export is not a valid XLSX"
          print("xlsx_bytes", os.path.getsize("workbook.xlsx"))
          PY

      - name: Prepare local DuckDB-Wasm browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          echo "npm_duckdb_wasm=$(npm view @duckdb/duckdb-wasm version)"
          npm install --no-save @duckdb/duckdb-wasm esbuild puppeteer-core >/dev/null
          node -p "'installed_duckdb_wasm=' + require('./node_modules/@duckdb/duckdb-wasm/package.json').version"
          npx esbuild node_modules/@duckdb/duckdb-wasm/dist/duckdb-browser.mjs \
            --bundle --platform=browser --format=esm --outfile=duckdb.bundle.mjs
          cp node_modules/@duckdb/duckdb-wasm/dist/duckdb-eh.wasm .
          cp node_modules/@duckdb/duckdb-wasm/dist/duckdb-browser-eh.worker.js .
          ls -lh duckdb.bundle.mjs duckdb-eh.wasm duckdb-browser-eh.worker.js workbook.xlsx

      - name: Build browser DuckDB-Wasm probe
        shell: bash
        run: |
          cat > probe.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>RUNNING</title></head>
          <body>
          <pre id="result"></pre>
          <pre id="error"></pre>
          <script type="module">
          import * as duckdb from './duckdb.bundle.mjs';

          const allow = ['users','fiat_transactions','crypto_transactions','exchange_rates'];
          const registry = await (await fetch('./mandatory-gates.json')).json();
          const skillRevision = (await (await fetch('./skill-revision.txt')).text()).trim();
          const out = {
            runtime: { skill_revision: skillRevision },
            source: {},
            sheets: {},
            quality: {},
            gates: {
              registry_version: registry.version,
              required: registry.gates.map(g => g.id),
              statuses: {},
              downstream: {}
            }
          };
          const clean = (v) => {
            if (typeof v === 'bigint') return v.toString();
            if (v instanceof Date) return v.toISOString();
            if (ArrayBuffer.isView(v)) {
              const values = Array.from(v, clean);
              return values.length === 1 ? values[0] : values;
            }
            if (Array.isArray(v)) return v.map(clean);
            if (v && typeof v === 'object') {
              const o = {};
              for (const [k,x] of Object.entries(v)) o[k] = clean(x);
              return o;
            }
            return v;
          };
          const rows = (table) => table.toArray().map((row) => {
            const o = {};
            for (const f of table.schema.fields) o[f.name] = clean(row[f.name]);
            return o;
          });
          const sha256Hex = async (input) => {
            const bytes = typeof input === 'string'
              ? new TextEncoder().encode(input)
              : input;
            const hash = await crypto.subtle.digest('SHA-256', bytes);
            return [...new Uint8Array(hash)].map(x => x.toString(16).padStart(2, '0')).join('');
          };

          try {
            const bundle = {
              mainModule: new URL('./duckdb-eh.wasm', location.href).href,
              mainWorker: new URL('./duckdb-browser-eh.worker.js', location.href).href,
              pthreadWorker: null
            };
            const worker = new Worker(bundle.mainWorker);
            const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
            await db.instantiate(bundle.mainModule, bundle.pthreadWorker);

            const sourceArrayBuffer = await (await fetch('./workbook.xlsx')).arrayBuffer();
            const sourceBytes = sourceArrayBuffer.byteLength;
            const sourceTransportSha256 = await sha256Hex(sourceArrayBuffer.slice(0));
            const buf = new Uint8Array(sourceArrayBuffer);
            await db.registerFileBuffer('workbook.xlsx', buf);
            const conn = await db.connect();
            await conn.query('INSTALL excel; LOAD excel;');

            out.runtime.bundle = bundle.mainModule;
            out.runtime.duckdb = rows(await conn.query('SELECT version() AS version'));
            out.source.mapping = {
              source_url: 'https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx',
              vfs_filename: 'workbook.xlsx',
              transport_bytes: sourceBytes,
              transport_sha256: sourceTransportSha256
            };
            out.runtime.scalar_normalization_probe = clean(new Int32Array([3]));
            if (out.runtime.scalar_normalization_probe !== 3) {
              throw new Error('RESULT_SHAPE_INVALID scalar normalization probe');
            }
            out.runtime.alias_safety_probe = rows(await conn.query(
              "SELECT 'fiat' AS rail, 1 AS before_rows, 2 AS after_rows"
            ));

            for (const sheet of allow) {
              const src = "read_xlsx('workbook.xlsx', sheet = '" + sheet + "', header = true)";
              await conn.query('CREATE OR REPLACE VIEW ' + sheet + '_raw AS SELECT * FROM ' + src);
              out.sheets[sheet] = {
                count: rows(await conn.query('SELECT COUNT(*) AS row_count FROM ' + sheet + '_raw')),
                schema: rows(await conn.query('DESCRIBE SELECT * FROM ' + sheet + '_raw')),
                summary: rows(await conn.query('SUMMARIZE SELECT * FROM ' + sheet + '_raw')),
                sample: rows(await conn.query('SELECT * FROM ' + sheet + '_raw LIMIT 5'))
              };
            }

            const logicalOrder = {
              users: 'uid',
              fiat_transactions: 'fiat_order_id',
              crypto_transactions: 'crypto_order_id',
              exchange_rates: 'asset, effective_date, source'
            };
            const logicalDataset = [];
            for (const sheet of allow) {
              const logicalRows = rows(await conn.query(
                'SELECT * FROM ' + sheet + '_raw ORDER BY ' + logicalOrder[sheet]
              ));
              logicalDataset.push({ sheet, rows: logicalRows });
            }
            out.source.logical_revision = {
              algorithm: 'sha256',
              contract: 'sqlbt-logical-v1|fixed-sheet-order|fixed-row-order|schema-column-order|normalized-scalars',
              value: await sha256Hex(JSON.stringify(logicalDataset))
            };
            if (!/^[0-9a-f]{64}$/.test(out.source.logical_revision.value)) {
              throw new Error('INVALID_LOGICAL_DATA_REVISION');
            }

            const run = async (sql) => ({sql, rows: rows(await conn.query(sql))});
            out.quality = {};
            out.quality.user_duplicate_uids = await run(`
              SELECT uid, COUNT(*) AS rows,
                     COUNT(DISTINCT user_name) AS names,
                     COUNT(DISTINCT country_code) AS countries,
                     COUNT(DISTINCT base_fiat_currency) AS base_currencies,
                     COUNT(DISTINCT kyc_level) AS kyc_levels,
                     COUNT(DISTINCT account_status) AS account_statuses
              FROM users_raw
              GROUP BY uid
              HAVING COUNT(*) > 1
              ORDER BY rows DESC, uid
            `);
            out.quality.user_duplicate_rows = await run(`
              SELECT *
              FROM users_raw
              WHERE uid IN (
                SELECT uid FROM users_raw GROUP BY uid HAVING COUNT(*) > 1
              )
              ORDER BY uid, user_name, created_at
            `);
            out.quality.order_id_uniqueness = await run(`
              SELECT 'fiat' AS source,
                     COUNT(*) AS rows,
                     COUNT(DISTINCT fiat_order_id) AS distinct_order_ids,
                     COUNT(*) - COUNT(DISTINCT fiat_order_id) AS duplicate_rows
              FROM fiat_transactions_raw
              UNION ALL
              SELECT 'crypto',
                     COUNT(*),
                     COUNT(DISTINCT crypto_order_id),
                     COUNT(*) - COUNT(DISTINCT crypto_order_id)
              FROM crypto_transactions_raw
            `);
            out.quality.orphan_uids = await run(`
              WITH u AS (SELECT DISTINCT uid FROM users_raw),
              tx AS (
                SELECT 'fiat' AS source, CAST(CAST(uid AS BIGINT) AS VARCHAR) AS uid
                FROM fiat_transactions_raw
                UNION ALL
                SELECT 'crypto', CAST(CAST(uid AS BIGINT) AS VARCHAR)
                FROM crypto_transactions_raw
              )
              SELECT tx.source, tx.uid, COUNT(*) AS rows
              FROM tx
              LEFT JOIN u USING(uid)
              WHERE u.uid IS NULL
              GROUP BY tx.source, tx.uid
              ORDER BY tx.source, rows DESC, tx.uid
            `);
            out.quality.status_completion = await run(`
              SELECT 'fiat' AS source, status, COUNT(*) AS rows,
                     CAST(SUM(CASE WHEN completed_at IS NULL THEN 1 ELSE 0 END) AS BIGINT) AS null_completed_at,
                     CAST(SUM(CASE WHEN completed_at < created_at THEN 1 ELSE 0 END) AS BIGINT) AS completed_before_created
              FROM fiat_transactions_raw
              GROUP BY status
              UNION ALL
              SELECT 'crypto', status, COUNT(*),
                     CAST(SUM(CASE WHEN completed_at IS NULL THEN 1 ELSE 0 END) AS BIGINT),
                     CAST(SUM(CASE WHEN completed_at < created_at THEN 1 ELSE 0 END) AS BIGINT)
              FROM crypto_transactions_raw
              GROUP BY status
              ORDER BY source, status
            `);
            out.quality.amount_fee_checks = await run(`
              SELECT 'fiat' AS source,
                     CAST(SUM(CASE WHEN amount IS NULL THEN 1 ELSE 0 END) AS BIGINT) AS null_amount,
                     CAST(SUM(CASE WHEN amount <= 0 THEN 1 ELSE 0 END) AS BIGINT) AS nonpositive_amount,
                     CAST(SUM(CASE WHEN fee IS NULL THEN 1 ELSE 0 END) AS BIGINT) AS null_fee,
                     CAST(SUM(CASE WHEN fee < 0 THEN 1 ELSE 0 END) AS BIGINT) AS negative_fee
              FROM fiat_transactions_raw
              UNION ALL
              SELECT 'crypto',
                     CAST(SUM(CASE WHEN amount IS NULL THEN 1 ELSE 0 END) AS BIGINT),
                     CAST(SUM(CASE WHEN amount <= 0 THEN 1 ELSE 0 END) AS BIGINT),
                     CAST(SUM(CASE WHEN fee IS NULL THEN 1 ELSE 0 END) AS BIGINT),
                     CAST(SUM(CASE WHEN fee < 0 THEN 1 ELSE 0 END) AS BIGINT)
              FROM crypto_transactions_raw
            `);
            out.quality.rate_rows = await run(`
              SELECT asset, asset_name, asset_type, quote_currency,
                     rate_to_usdt, usdt_to_asset_rate, effective_date, source
              FROM exchange_rates_raw
              ORDER BY asset, source
            `);
            out.quality.rate_key_check = await run(`
              SELECT asset, effective_date,
                     COUNT(*) AS rows,
                     COUNT(DISTINCT rate_to_usdt) AS distinct_rates,
                     MIN(rate_to_usdt) AS min_rate,
                     MAX(rate_to_usdt) AS max_rate
              FROM exchange_rates_raw
              GROUP BY asset, effective_date
              HAVING COUNT(*) > 1
              ORDER BY asset, effective_date
            `);
            out.quality.rate_coverage = await run(`
              WITH needed AS (
                SELECT DISTINCT currency AS asset FROM fiat_transactions_raw
                UNION
                SELECT DISTINCT asset FROM crypto_transactions_raw
              )
              SELECT n.asset,
                     COUNT(r.asset) AS rate_rows,
                     COUNT(DISTINCT r.rate_to_usdt) AS distinct_rates,
                     MIN(r.rate_to_usdt) AS min_rate,
                     MAX(r.rate_to_usdt) AS max_rate,
                     MIN(r.effective_date) AS min_effective_date,
                     MAX(r.effective_date) AS max_effective_date
              FROM needed n
              LEFT JOIN exchange_rates_raw r USING(asset)
              GROUP BY n.asset
              ORDER BY n.asset
            `);
            out.quality.join_cardinality_users = await run(`
              WITH u AS (
                SELECT uid, COUNT(*) AS n FROM users_raw GROUP BY uid
              ),
              f AS (
                SELECT CAST(CAST(uid AS BIGINT) AS VARCHAR) AS uid FROM fiat_transactions_raw
              ),
              c AS (
                SELECT CAST(CAST(uid AS BIGINT) AS VARCHAR) AS uid FROM crypto_transactions_raw
              )
              SELECT 'fiat' AS source,
                     (SELECT COUNT(*) FROM f) AS before_rows,
                     (SELECT COUNT(*) FROM f JOIN users_raw u2 ON f.uid = u2.uid) AS after_rows
              UNION ALL
              SELECT 'crypto',
                     (SELECT COUNT(*) FROM c),
                     (SELECT COUNT(*) FROM c JOIN users_raw u2 ON c.uid = u2.uid)
            `);
            out.quality.time_ranges = await run(`
              SELECT 'fiat' AS source, MIN(created_at) AS min_created_at, MAX(created_at) AS max_created_at
              FROM fiat_transactions_raw
              UNION ALL
              SELECT 'crypto', MIN(created_at), MAX(created_at)
              FROM crypto_transactions_raw
            `);

            out.quality.order_id_date_consistency = await run(`
              WITH fiat AS (
                SELECT
                  'fiat' AS source,
                  fiat_order_id AS order_id,
                  CAST(STRPTIME(SUBSTR(fiat_order_id, 4, 8), '%Y%m%d') AS DATE) AS id_date,
                  CAST(created_at AS DATE) AS created_date
                FROM fiat_transactions_raw
                WHERE REGEXP_MATCHES(fiat_order_id, '^fo_[0-9]{8}_')
              ),
              crypto AS (
                SELECT
                  'crypto' AS source,
                  crypto_order_id AS order_id,
                  CAST(STRPTIME(SUBSTR(crypto_order_id, 4, 8), '%Y%m%d') AS DATE) AS id_date,
                  CAST(created_at AS DATE) AS created_date
                FROM crypto_transactions_raw
                WHERE REGEXP_MATCHES(crypto_order_id, '^co_[0-9]{8}_')
              )
              SELECT source, order_id, id_date, created_date
              FROM (
                SELECT * FROM fiat
                UNION ALL
                SELECT * FROM crypto
              )
              WHERE id_date <> created_date
              ORDER BY source, order_id
            `);

            const num = (v) => Number(v ?? 0);
            out.gates.statuses.user_key_uniqueness =
              out.quality.user_duplicate_uids.rows.length === 0 ? 'PASS' : 'FAIL';
            out.gates.statuses.order_id_uniqueness =
              out.quality.order_id_uniqueness.rows.every(r => num(r.duplicate_rows) === 0) ? 'PASS' : 'FAIL';
            out.gates.statuses.orphan_uid =
              out.quality.orphan_uids.rows.length === 0 ? 'PASS' : 'FAIL';
            out.gates.statuses.status_completion =
              out.quality.status_completion.rows.every(r =>
                num(r.completed_before_created) === 0 &&
                (r.status !== 'completed' || num(r.null_completed_at) === 0)
              ) ? 'PASS' : 'FAIL';
            out.gates.statuses.amount_fee_validity =
              out.quality.amount_fee_checks.rows.every(r =>
                num(r.null_amount) === 0 &&
                num(r.nonpositive_amount) === 0 &&
                num(r.null_fee) === 0 &&
                num(r.negative_fee) === 0
              ) ? 'PASS' : 'FAIL';
            out.gates.statuses.rate_key_uniqueness =
              out.quality.rate_key_check.rows.length === 0 ? 'PASS' : 'FAIL';
            out.gates.statuses.rate_coverage =
              out.quality.rate_coverage.rows.every(r => num(r.rate_rows) > 0) ? 'PASS' : 'FAIL';
            out.gates.statuses.join_cardinality_users =
              out.quality.join_cardinality_users.rows.every(r => num(r.before_rows) === num(r.after_rows)) ? 'PASS' : 'FAIL';
            out.gates.statuses.order_id_date_consistency =
              out.quality.order_id_date_consistency.rows.length === 0 ? 'PASS' : 'FAIL';

            const required = new Set(out.gates.required);
            const implemented = new Set(Object.keys(out.gates.statuses));
            const missing = [...required].filter(id => !implemented.has(id));
            const unexpected = [...implemented].filter(id => !required.has(id));
            out.gates.coverage = {
              state: missing.length === 0 && unexpected.length === 0 ? 'PASS' : 'HARNESS_STALE',
              missing,
              unexpected
            };
            if (out.gates.coverage.state !== 'PASS') {
              throw new Error('HARNESS_STALE ' + JSON.stringify(out.gates.coverage));
            }

            out.gates.downstream.time_analysis =
              out.gates.statuses.order_id_date_consistency === 'PASS'
                ? 'READY'
                : 'BLOCKED_DATA_QUALITY';

            // D11: execute the unchanged D10 SQL file, only after all quality gates pass.
            if (Object.values(out.gates.statuses).some(s => s !== 'PASS')) {
              out.d11 = { state: 'BLOCKED_DATA_QUALITY', rows: [] };
            } else {
              const sqlPath = 'skills/sql-business-thinking/tests/d10-fiat-direction-status.sql';
              const sqlResponse = await fetch('./' + sqlPath);
              if (!sqlResponse.ok) throw new Error('D10_SQL_FILE_UNAVAILABLE');
              const lockedSql = await sqlResponse.text();
              if (!lockedSql.includes('FROM fiat_transactions') ||
                  !lockedSql.includes('GROUP BY direction')) {
                throw new Error('D10_SQL_CONTRACT_INVALID');
              }
              // The D01 canonical view name is distinct from the runner's _raw staging view.
              await conn.query('CREATE OR REPLACE VIEW fiat_transactions AS SELECT * FROM fiat_transactions_raw');
              const execution = await run(lockedSql);
              const measured = execution.rows;
              const totalRaw = num(out.sheets.fiat_transactions.count[0].row_count);
              const categories = ['total_order_records','completed_records',
                'in_progress_records','terminal_noncompleted_records','unknown_status_records'];
              if (measured.some(r => categories.some(k => !Number.isFinite(num(r[k]))))) {
                throw new Error('D11_RESULT_SHAPE_INVALID');
              }
              const totalResult = measured.reduce((sum, r) => sum + num(r.total_order_records), 0);
              if (totalResult !== totalRaw) throw new Error('D11_TOTAL_ROWS_MISMATCH');
              const directions = measured.map(r => r.direction);
              if (new Set(directions).size !== directions.length) throw new Error('D11_DIRECTION_NOT_UNIQUE');
              for (const r of measured) {
                const total = num(r.total_order_records);
                const parts = num(r.completed_records) + num(r.in_progress_records)
                  + num(r.terminal_noncompleted_records) + num(r.unknown_status_records);
                if (parts !== total) throw new Error('D11_STATE_PARTITION_MISMATCH');
                const expected = total === 0 ? null : num(r.completed_records) / total;
                const actual = r.completed_state_share === null ? null : Number(r.completed_state_share);
                if ((expected === null) !== (actual === null) ||
                    (expected !== null && Math.abs(actual - expected) > 1e-12)) {
                  throw new Error('D11_RATIO_MISMATCH');
                }
              }
              out.d11 = {
                state: 'PASS',
                sql_path: sqlPath,
                sql_sha256: await sha256Hex(lockedSql),
                executed_sql: lockedSql,
                source_logical_revision: out.source.logical_revision.value,
                skill_revision: out.runtime.skill_revision,
                duckdb_version: out.runtime.duckdb,
                gate_coverage: out.gates.coverage.state,
                gate_statuses: out.gates.statuses,
                validation: {
                  source_fiat_rows: totalRaw,
                  result_fiat_rows: totalResult,
                  state_partition: 'PASS',
                  ratio_recalculation: 'PASS',
                  direction_uniqueness: 'PASS'
                },
                rows: measured
              };
            }

            await conn.close();
            await db.terminate();
            document.getElementById('result').textContent = JSON.stringify(out);
            document.title = 'DONE';
          } catch (e) {
            document.getElementById('error').textContent = String(e && e.stack ? e.stack : e);
            document.title = 'ERROR';
          }
          </script>
          </body>
          </html>
          HTML

          cat > run-probe.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import {writeFileSync} from 'node:fs';

          const executablePath = process.env.CHROME;
          const browser = await puppeteer.launch({
            executablePath,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const page = await browser.newPage();
          page.on('console', msg => console.log('[browser]', msg.type(), msg.text()));
          page.on('pageerror', err => console.error('[pageerror]', err.stack || String(err)));
          await page.goto('http://127.0.0.1:8765/probe.html', {waitUntil: 'networkidle2', timeout: 120000});
          await page.waitForFunction(
            () => document.title === 'DONE' || document.title === 'ERROR',
            {timeout: 120000}
          );
          const title = await page.title();
          const result = await page.$eval('#result', el => el.textContent || '');
          const error = await page.$eval('#error', el => el.textContent || '');
          await browser.close();
          if (title !== 'DONE') {
            console.error('BROWSER_ERROR_BEGIN');
            console.error(error);
            console.error('BROWSER_ERROR_END');
            process.exit(1);
          }
          if (!result) throw new Error('Empty DuckDB discovery result');
          writeFileSync('discovery.json', result);
          console.log('DISCOVERY_JSON_BEGIN');
          console.log(result);
          console.log('DISCOVERY_JSON_END');
          JS

      - name: Run real DuckDB-Wasm discovery
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome=$CHROME"
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node run-probe.mjs

      - name: Upload discovery and D11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sql-business-thinking-wasm-quality
          path: discovery.json
          if-no-files-found: error

  rendered_qa:
    name: D23 Report Rendered QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout artifact and evidence
        uses: actions/checkout@v4

      - name: Verify D22 immutable evidence and HTML
        shell: bash
        run: |
          set -euo pipefail
          python skills/sql-business-thinking/tests/check_d22_artifact.py

      - name: Prepare browser accessibility checker
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save puppeteer-core axe-core >/dev/null
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          node -p "'Chrome: ' + process.env.CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: D23 rendered QA desktop mobile 320px audit keyboard and accessibility
        shell: bash
        run: |
          set -euo pipefail
          node skills/sql-business-thinking/tests/d23_rendered_qa.mjs

      - name: Upload D23 QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-business-thinking-d23-rendered-qa
          path: d23-evidence/
          if-no-files-found: warn
