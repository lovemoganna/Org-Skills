name: BPRD Manual A/B Replay

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Select one behavioral case (A1 conflict / A2 change trace / A3 compactness / A4 evidence)
        required: true
        type: choice
        options:
          - A1
          - A2
          - A3
          - A4
      model:
        description: Optional accessible Copilot model ID; blank uses account default and is NOT pinned
        required: false
        type: string
        default: ''

permissions:
  contents: read
  copilot-requests: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Prepare same-task prompts
        shell: bash
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          cases = {
              "A1": "旧版约束：DuckDB Editor Pro 可视化继续使用 Chart.js，不更换技术栈。新反馈：全部图表改为 ECharts。两条均有效，且未说明谁有优先级。请用 bprd-plus 合并成可开发、可验收 BRD。未提供项目代码。",
              "A2": "初始需求：所有可视化组件共用统一格式化逻辑；筛选后图例与数据保持同步。新增反馈：页面切换不得残留之前数据集的图例与筛选状态。请用 bprd-plus 给出简短 BRD，说明新增反馈影响哪个原有要求以及哪条验收。没有真实组件、文件名、测试结果，不得推断。",
              "A3": "列表增加 CSV 导出按钮。只导出当前筛选结果；没有数据时禁用按钮。请用 bprd-plus 写一份最短可执行 BRD。不得扩大功能范围。",
              "A4": "全面扫描 DuckDB Editor Pro 可视化组件，找到共性根因再修复。当前没有代码、截图、构建日志或测试结果。请用 bprd-plus 整理成可开发、可验收 BRD。禁止声称已完成扫描、已修复或已通过测试。",
          }
          case = os.environ["CASE_ID"]
          old = subprocess.check_output(["git", "show", "2d84e28835c12375cc1519234f2fd4595cfa8349:skills/bprd-plus/SKILL.md"], text=True)
          new = Path("skills/bprd-plus/SKILL.md").read_text(encoding="utf-8")
          intro = "你正在执行 BRD 生成任务。以下 Skill 是唯一操作规范。不得访问仓库或工具；不得声称已验证效果。只输出中文 BRD，不输出评价。"
          out = Path("bprd-ab-results"); out.mkdir(exist_ok=True)
          for version, rules in [("baseline", old), ("candidate", new)]:
              (out / f"{version}.prompt.txt").write_text(intro + "\n<skill>\n" + rules + "\n</skill>\n<user>\n" + cases[case] + "\n</user>\n", encoding="utf-8")
          print("case:", case, "baseline: 2d84e288, candidate: checkout")
          PY
      - name: Independently replay both versions (read-only)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          echo "Model requested: ${MODEL:-ACCOUNT_DEFAULT_UNPINNED}"
          for arm in baseline candidate; do
            export COPILOT_HOME="$RUNNER_TEMP/copilot-$arm"
            mkdir -p "$COPILOT_HOME"
            args=(--max-ai-credits 30 --no-ask-user -s)
            if [[ -n "$MODEL" ]]; then args+=(--model "$MODEL"); fi
            timeout 240s copilot -p "$(cat "bprd-ab-results/$arm.prompt.txt")" "${args[@]}" > "bprd-ab-results/$arm.output.md"
            test -s "bprd-ab-results/$arm.output.md"
            echo "=== $arm output ==="
            cat "bprd-ab-results/$arm.output.md"
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bprd-manual-ab-results
          path: bprd-ab-results/
          retention-days: 30
