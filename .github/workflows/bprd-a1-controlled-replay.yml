name: BPRD A1 Controlled Replay

on:
  push:
    branches:
      - review/bprd-plus-evidence-gates-20261015
    paths:
      - .github/workflows/bprd-a1-controlled-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  a1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned-runner Copilot CLI
        run: npm install -g @github/copilot
      - name: Prepare frozen baseline and candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          baseline = subprocess.check_output(
              ["git", "show", "2d84e28835c12375cc1519234f2fd4595cfa8349:skills/bprd-plus/SKILL.md"], text=True
          )
          candidate = Path("skills/bprd-plus/SKILL.md").read_text(encoding="utf-8")
          task = """旧版约束：“DuckDB Editor Pro 可视化继续使用 Chart.js，不更换技术栈。”
          新反馈：“全部图表改为 ECharts。”
          两条均有效，且未说明谁有优先级。请用 bprd-plus 合并成可开发、可验收 BRD。未提供项目代码。"""
          intro = """你正在执行 BRD 生成任务。以下 Skill 是你此轮唯一的专业操作规范。
          不得访问仓库或外部工具；不得声称已访问代码、已验证效果。
          请直接给出最终中文 BRD，不输出 Skill 分析、评分、实验信息或自评。"""
          output = Path("bprd-a1-results")
          output.mkdir(exist_ok=True)
          for name, instruction in [("baseline",baseline),("candidate",candidate)]:
              (output / (name + ".prompt.txt")).write_text(
                  intro + "\n\n<skill>\n" + instruction + "\n</skill>\n\n<user>\n" + task + "\n</user>\n",
                  encoding="utf-8",
              )
          print("Prepared A1 baseline and candidate: same task, frozen base SHA")
          PY
      - name: A1 run baseline and candidate (isolated sessions)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-test
        run: |
          set -euo pipefail
          for arm in baseline candidate; do
            mkdir -p "$RUNNER_TEMP/copilot-$arm"
            export COPILOT_HOME="$RUNNER_TEMP/copilot-$arm"
            timeout 240s copilot -p "$(cat "bprd-a1-results/$arm.prompt.txt")" \
              --model gpt-5-mini --max-ai-credits 30 --no-ask-user -s \
              > "bprd-a1-results/$arm.output.md"
            test -s "bprd-a1-results/$arm.output.md"
            echo "=== $arm output ==="
            cat "bprd-a1-results/$arm.output.md"
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bprd-a1-paired-results
          path: bprd-a1-results/
          retention-days: 30
