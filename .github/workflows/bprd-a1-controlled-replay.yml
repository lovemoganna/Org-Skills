name: BPRD A2v2 Controlled Replay

on:
  push:
    branches:
      - review/bprd-plus-evidence-gates-20261015
    paths:
      - .github/workflows/bprd-a1-controlled-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  a1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned-runner Copilot CLI
        run: npm install -g @github/copilot
      - name: Prepare frozen baseline and candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          baseline = subprocess.check_output(
              ["git", "show", "2d84e28835c12375cc1519234f2fd4595cfa8349:skills/bprd-plus/SKILL.md"], text=True
          )
          candidate = Path("skills/bprd-plus/SKILL.md").read_text(encoding="utf-8")
          task = """初始需求：“所有可视化组件共用统一格式化逻辑；筛选后图例与数据保持同步。”
          新增反馈：“页面切换不得残留之前数据集的图例与筛选状态。”
          请用 bprd-plus 给出简短 BRD，需要说明新增反馈影响哪个原有要求以及哪条验收。
          没有真实组件、文件名、测试结果，不得推断。"""
          intro = """你正在执行 BRD 生成任务。以下 Skill 是你此轮唯一的专业操作规范。
          不得访问仓库或外部工具；不得声称已访问代码、已验证效果。
          请直接给出最终中文 BRD，不输出 Skill 分析、评分、实验信息或自评。"""
          output = Path("bprd-a2v2-results")
          output.mkdir(exist_ok=True)
          for name, instruction in [("baseline",baseline),("candidate",candidate)]:
              (output / (name + ".prompt.txt")).write_text(
                  intro + "\n\n<skill>\n" + instruction + "\n</skill>\n\n<user>\n" + task + "\n</user>\n",
                  encoding="utf-8",
              )
          print("Prepared A2v2 baseline and candidate: same task, frozen base SHA")
          PY
      - name: A2v2 run baseline and candidate (isolated sessions)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-test
        run: |
          set -euo pipefail
          for arm in baseline candidate; do
            mkdir -p "$RUNNER_TEMP/copilot-$arm"
            export COPILOT_HOME="$RUNNER_TEMP/copilot-$arm"
            timeout 240s copilot -p "$(cat "bprd-a2v2-results/$arm.prompt.txt")" \
              --max-ai-credits 30 --no-ask-user -s \
              > "bprd-a2v2-results/$arm.output.md"
            test -s "bprd-a2v2-results/$arm.output.md"
            echo "=== $arm output ==="
            cat "bprd-a2v2-results/$arm.output.md"
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bprd-a1-paired-results
          path: bprd-a2v2-results/
          retention-days: 30
