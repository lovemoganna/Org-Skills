name: Dashboard historical branch audit and main regression
on:
  push:
    branches:
      - ops/branch-backup-20261019
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'lovemoganna/Org-Skills'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only audit and main regression
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          python3 .github/scripts/dashboard_branch_audit_20261019.py
      - name: Save full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-16-branches-audit
          path: dashboard-audit/
          retention-days: 90
          if-no-files-found: error
