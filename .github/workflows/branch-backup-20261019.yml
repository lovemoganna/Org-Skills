name: Org-Skills batch 2 immutable full-history backup
on:
  push:
    branches:
      - ops/branch-backup-20261019
permissions:
  contents: read
  pull-requests: read
jobs:
  archive:
    if: github.repository == 'lovemoganna/Org-Skills'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate complete branch snapshot and verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root=pathlib.Path.cwd()
          data=json.loads((root/'.github/branch-cleanup-batch2-20261019.json').read_text())
          assert data['phase']=='BATCH2_BACKUP_ONLY'
          assert data['repo']=='lovemoganna/Org-Skills'
          def out(*args):
              return subprocess.check_output(args,text=True).strip()
          def remote():
              return dict((line.split()[1].removeprefix('refs/heads/'),line.split()[0])
                          for line in out('git','ls-remote','--heads','origin').splitlines())
          refs=remote()
          assert len(refs)==data['expected_ref_count'], 'BRANCH_COUNT_DRIFT'
          assert refs['main']==data['main_sha'], 'MAIN_MOVED'
          assert len(data['targets'])==15, 'TARGET_COUNT'
          prs=json.loads(out('gh','api','repos/lovemoganna/Org-Skills/pulls?state=open&per_page=100'))
          assert len(prs)<100, 'PR_PAGINATION'
          prheads={p['head']['ref'] for p in prs}
          assert not prheads.intersection(data['targets']), 'OPEN_PR_TARGET'
          for name,sha in data['targets'].items():
              assert refs.get(name)==sha,'TARGET_REF_CHANGED:'+name
              base=out('git','merge-base',refs['main'],sha)
              changes=subprocess.check_output(['git','diff','--name-only','-z',base,sha]).split(b'\x00')
              changed=[x.decode('utf-8') for x in changes if x]
              assert changed, 'NO_CHANGED_PATHS:'+name
              for path in changed:
                  def blob(rev):
                      result=subprocess.run(['git','rev-parse','--verify',rev+':'+path],
                                            capture_output=True,text=True)
                      return result.stdout.strip() if result.returncode==0 else None
                  assert blob(refs['main'])==blob(sha),'CONTENT_DIFFERENCE:'+name+':'+path
          remote_tracking=dict((line.split()[1].removeprefix('refs/remotes/origin/'),line.split()[0])
                               for line in out('git','for-each-ref','--format=%(objectname) %(refname)','refs/remotes/origin').splitlines()
                               if line.split()[1]!='refs/remotes/origin/HEAD')
          assert refs==remote_tracking,'REMOTE_TRACKING_MISMATCH'
          dest=root/'batch2-backup'
          dest.mkdir(exist_ok=True)
          (dest/'manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          (dest/'refs.json').write_text(json.dumps(refs,indent=2)+'\n')
          (dest/'open-pr-heads.json').write_text(json.dumps(sorted(prheads),indent=2)+'\n')
          bundle=dest/'complete-branches.bundle'
          subprocess.run(['git','bundle','create',str(bundle),'--all'],check=True)
          empty=dest/'empty.git'
          subprocess.run(['git','init','--bare',str(empty)],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(['git','-C',str(empty),'bundle','verify',str(bundle)],check=True)
          listed=set(out('git','bundle','list-heads',str(bundle)).splitlines())
          for name,sha in refs.items():
              assert sha+' refs/remotes/origin/'+name in listed,'MISSING_BUNDLE_BRANCH:'+name
          digest=hashlib.sha256(bundle.read_bytes()).hexdigest()
          (dest/'complete-branches.sha256').write_text(digest+'  complete-branches.bundle\n')
          (dest/'CHECKS.txt').write_text('BATCH2_BACKUP_VERIFIED\nMAIN '+refs['main']+
              '\nBRANCHES '+str(len(refs))+'\nTARGETS '+str(len(data['targets']))+
              '\nSHA256 '+digest+'\n')
          print((dest/'CHECKS.txt').read_text())
          PY
          rm -rf batch2-backup/empty.git
      - uses: actions/upload-artifact@v4
        with:
          name: org-skills-batch2-full-git-bundle
          path: batch2-backup/
          retention-days: 90
          if-no-files-found: error
