name: Dual SQL Skills Contract Regression
on:
  push:
    branches: [main, refactor/sql-two-skills-20261011]
    paths:
      - "skills/business-reasoning/**"
      - "skills/analysis-verifier/**"
      - "skills/business-reasoning/tests/**"
      - "skills/sql-business-thinking/SKILL.md"
      - "skills/sql-business-thinking/legacy/**"
      - "skills/sql-business-thinking/tests/check_dual_split.py"
      - "skills/sql-business-thinking/tests/check_repo.py"
      - ".github/workflows/sql-dual-skill-regression.yml"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  split-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dual boundary and synthetic adversarial case
        run: python3 skills/sql-business-thinking/tests/check_dual_split.py
      - name: Preserve historical skill and source read regression
        run: |
          python3 skills/sql-business-thinking/tests/check_repo.py
          python3 skills/sql-business-thinking/tests/check_native_contract.py
  four-sheet-native:
    needs: split-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned DuckDB 1.4.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 https://github.com/duckdb/duckdb/releases/download/v1.4.2/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip -q duckdb.zip
          chmod +x duckdb
          ./duckdb -version
      - name: Materialize exact four sheets once and verify Q001
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dual-evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          src=Path(".github/workflows/sql-business-thinking-native-duckdb-url-test.yml").read_text()
          m=re.search(r"cat > d02\.sql <<'SQL'\n([\s\S]*?)\n\s+SQL\b",src)
          assert m, "cannot recover preserved original source SQL"
          original="\n".join(line[10:] if line.startswith("          ") else line for line in m.group(1).splitlines())+"\n"
          url="https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx"
          assert original.count("read_xlsx(")==4 and original.count("'"+url+"'")==4
          for sheet in ("users","fiat_transactions","crypto_transactions","exchange_rates"):
              assert original.count("sheet = '"+sheet+"'")==1
          for instruction in ("INSTALL httpfs;","LOAD httpfs;","INSTALL excel;","LOAD excel;"):
              assert original.count(instruction)==1
          Path("dual-evidence/original-read.sha256").write_text(hashlib.sha256(original.encode()).hexdigest()+"\n")
          probes=Path("skills/analysis-verifier/tests/q001-verification.sql").read_text()
          q002=Path("skills/analysis-verifier/tests/q002-verification.sql").read_text()
          assert "read_xlsx(" not in probes+q002, "only materialized tables allowed in verification"
          Path("dual-evidence/full.sql").write_text(original+"\n"+probes+"\n"+q002)
          PY
          ./duckdb < dual-evidence/full.sql
      - name: Independent feedback receipt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,datetime,hashlib,os
          root=Path('dual-evidence')
          load=lambda n:json.loads((root/(n+'.json')).read_text())
          stat,quality,rates,group,counts=[load(x) for x in ('status','quality','rates','concentration','source-counts')]
          assert len(counts)==1 and all(counts[0][k]>=0 for k in counts[0])
          byrail={r['rail']:r for r in quality}
          assert set(byrail)=={'fiat','crypto'}
          assert sum(int(x['rows']) for x in stat if x['rail']=='fiat')==counts[0]['fiat_rows']
          assert sum(int(x['rows']) for x in stat if x['rail']=='crypto')==counts[0]['crypto_rows']
          issues=[]
          check_total=sum(int(x['completed_orders']) for x in group)
          completed_total=sum(int(x['completed_rows']) for x in quality)
          if check_total!=completed_total:
              issues.append('completed-rows-dropped-during-grouping')
          if any(int(q['invalid_amounts']) or int(q['missing_assets']) or int(q['missing_uids']) for q in quality):
              issues.append('missing-or-invalid-key-or-amount')
          for row in group:
              if row['top1_share_pct'] is None or row['active_users']<2:
                  issues.append('concentration-unsupported-for-'+row['rail']+'-'+str(row['asset']))
          result={'packet_id':'Q001','revision':1,'verdict':'UNRESOLVED' if issues else 'VERIFIED',
             'execution_receipt':{'engine':'Native DuckDB v1.4.2','commit':os.environ.get('GITHUB_SHA'),
              'source_sql_sha256':(root/'original-read.sha256').read_text().strip()},
             'validated_facts':{'source_rows':counts[0],'rail_asset_groups':group,'status_rows':stat},
             'counterevidence':issues,'root_cause':'asset-specific semantics; status completed may not equal settled',
             'new_signal':'rail and asset specific completed activity and user concentration (no risk assertion)',
             'impact_on_decision':'only within-asset, within-rail descriptive evidence; no cross-currency retention claim',
             'minimal_correction':'A should drill into per-asset frequency vs large transactions only when concentration is material and denominator adequate',
             'next_test':'independent unique order-id and completion semantic review'}
          (root/'verification-feedback.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,default=str))
          q2orders,q2mechanism=[load(x)[0] for x in ('q002-orders','q002-mechanism')]
          usd=next((x for x in group if x['rail']=='fiat' and x['asset']=='USD'),None)
          q2issues=[]
          if usd is None: q2issues.append('USD-group-not-present')
          else:
              if int(usd['completed_orders'])!=int(q2mechanism['completed_usd_orders']): q2issues.append('Q001-Q002-order-count-mismatch')
              if abs(float(usd['native_total'])-float(q2mechanism['native_total']))>0.000001: q2issues.append('Q001-Q002-amount-reconciliation-failed')
          if int(q2orders['completed_usd_orders'])!=int(q2orders['distinct_order_ids']): q2issues.append('duplicate-or-null-fiat-order-id')
          if int(q2orders['invalid_amounts']) or int(q2orders['null_uids']): q2issues.append('invalid-amount-or-UID')
          verdict='REJECTED' if q2issues else 'VERIFIED'
          q2feedback={'packet_id':'Q002','revision':1,'verdict':verdict,
              'execution_receipt':{'engine':'Native DuckDB v1.4.2','commit':os.environ.get('GITHUB_SHA'),
                'source_sql_sha256':(root/'original-read.sha256').read_text().strip()},
              'validated_facts':q2mechanism,'counterevidence':q2issues,
              'root_cause':'needs order-level decomposition, not simple ranked-user total',
              'new_signal':'evidence for USD top-user concentration sensitivity to largest order',
              'impact_on_decision':'concentration arithmetic is not by itself a finding of risk or account retention',
              'minimal_correction':'A interpret largest-order sensitivity and close or pursue event-specific root cause',
              'next_test':'time, direction and transaction-status semantics require separate evidence if pursuing cashflow'}
          (root/'q002-verification-feedback.json').write_text(json.dumps(q2feedback,ensure_ascii=False,indent=2,default=str))
          print(json.dumps({'Q001':result['verdict'],'Q002':verdict,'USD':q2mechanism,'issues':q2issues},ensure_ascii=False,default=str))
          print(json.dumps({'verdict':result['verdict'],'source_rows':counts[0],'groups':len(group),'issues':issues,'commit':os.environ.get('GITHUB_SHA')},ensure_ascii=False))
          PY
      - name: Same-run scoped handoff replay (Q002)
        run: python3 skills/analysis-verifier/scripts/replay_four_sheet_handoff.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-skill-real-four-sheet-evidence
          path: |
            dual-evidence/verification-feedback.json
            dual-evidence/q002-verification-feedback.json
            dual-evidence/q002-orders.json
            dual-evidence/q002-mechanism.json
            dual-evidence/status.json
            dual-evidence/quality.json
            dual-evidence/rates.json
            dual-evidence/concentration.json
            dual-evidence/source-counts.json
            dual-evidence/original-read.sha256
            dual-evidence/s3-scoped-qa.json
            dual-evidence/s4-scoped-finding.json
            dual-evidence/s1-s4-review.json
          if-no-files-found: warn
