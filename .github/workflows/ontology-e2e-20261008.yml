name: Ontology E2E 2026-10-08
on:
  push:
    branches: [ontology-e2e-20261008]
    paths: [".github/workflows/ontology-e2e-20261008.yml"]
permissions:
  contents: read
jobs:
  real-workbook:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.2
      - name: Read authorized XLSX sheets and execute independent checks
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, decimal, hashlib, json, pathlib, traceback
          import duckdb, csv, base64, zlib, subprocess, sys
          src = "https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx"
          allowed = ("users", "fiat_transactions", "crypto_transactions", "exchange_rates")
          selection = """SELECT *
          FROM read_xlsx(
              'https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx',
              sheet = 'users',
              header = true
          );"""
          selection=selection.replace("\\n          FROM","\\nFROM").replace("\\n              '","\\n    '").replace("\\n              sheet","\\n    sheet").replace("\\n              header","\\n    header").replace("\\n          );","\\n);")
          out={"engine":"DuckDB 1.4.2","source":src,"allowed_sheets":allowed,"phase":"runtime","init":[],"materializations":[],"schemas":{},"raw_rows":{},"checks":[],"queries":[],"execution_mode":"sequential load; concurrent read-only isolated connections"}
          def ser(v):
              if isinstance(v,(datetime.date,datetime.datetime,datetime.time,decimal.Decimal)):return str(v)
              if isinstance(v,(bytes,bytearray)):return v.hex()
              return v
          def dump():
              pathlib.Path("ontology-e2e-20261008.json").write_text(json.dumps(out,ensure_ascii=False,default=ser,indent=2))
          def qident(k):return '"'+k.replace('"','""')+'"'
          def has(t,*cols): return set(cols).issubset(set(out["schemas"].get(t,[])))
          try:
              con=duckdb.connect("ontology-20261008.duckdb")
              out["duckdb_version"]=con.execute("SELECT version()").fetchone()[0]
              for stmt in ("INSTALL httpfs;","LOAD httpfs;","INSTALL excel;","LOAD excel;"):
                  con.execute(stmt);out["init"].append({"sql":stmt,"status":"PASS"})
              out["phase"]="source"
              for sheet in allowed:
                  select=selection.replace("sheet = 'users'","sheet = '"+sheet+"'")
                  query="CREATE TABLE "+qident(sheet)+" AS\n"+select
                  con.execute(query)
                  meta=con.execute("DESCRIBE "+qident(sheet)).fetchall()
                  out["schemas"][sheet]=[x[0] for x in meta]
                  cur=con.execute("SELECT * FROM "+qident(sheet))
                  cols=[x[0] for x in cur.description]
                  rows=cur.fetchall()
                  out["raw_rows"][sheet]=[dict(zip(cols,map(ser,row))) for row in rows]
                  out["materializations"].append({"table":sheet,"read_xlsx_calls":1,"count":len(rows),"columns":cols,"query":query,"status":"PASS"})
              # Gate 1 is verified before any analytical SQL in this corrected CI run.
              out["phase"]="gate1"
              mod_path=pathlib.Path("ontology-model-20261008.json")
              encoded=pathlib.Path("skills/ontology-constrained-analysis/tests/e2e-20261008-ontology.zlib.b64").read_text().strip()
              mod_path.write_bytes(zlib.decompress(base64.b64decode(encoded)))
              model=json.loads(mod_path.read_text())
              schema_args=[]
              for table in allowed:
                  file="schema-"+table+".csv"
                  with open(file,"w",newline="",encoding="utf-8") as stream:
                      writer=csv.writer(stream);writer.writerow(["column_name"])
                      for col in out["schemas"][table]:writer.writerow([col])
                  schema_args.extend(["--schema",table+"="+file])
              proc=subprocess.run([sys.executable,"skills/ontology-constrained-analysis/scripts/check_ontology_sources.py","--model",str(mod_path)]+schema_args,capture_output=True,text=True)
              gate_receipt=json.loads(proc.stdout)
              out["gate1"]={"atom_count":len(model["ontology_atoms"]),"rule_count":len(model["ontology_rules"]),"model_sha256":hashlib.sha256(mod_path.read_bytes()).hexdigest(),"checker":"scripts/check_ontology_sources.py","structural_source_status":gate_receipt["status"],"semantic_review":"separate manual source/meaning review retained in deliverable; not certified by checker","errors":gate_receipt["errors"]}
              assert proc.returncode==0 and gate_receipt["status"]=="PASS_STRUCTURE_AND_SOURCE_ONLY",proc.stderr+" "+proc.stdout
              con.close()
              out["phase"]="analysis"
              qs=[]
              def add(n,s,sql):
                  qs.append({"name":n,"scope":s,"sql":sql})
              for t in allowed:
                  add("row_count_"+t,t,"SELECT COUNT(*) AS row_count FROM "+qident(t))
              for t in ("fiat_transactions","crypto_transactions"):
                  dim = "currency" if t=="fiat_transactions" else "asset"
                  if has(t,dim,"status","direction","amount"):
                      add("instrument_state_"+t,t,"SELECT "+qident(dim)+" AS instrument,status,direction,COUNT(*) AS records,SUM(TRY_CAST(amount AS DOUBLE)) AS amount_native FROM "+qident(t)+" GROUP BY 1,2,3 ORDER BY 1,2,3")
                  if has(t,dim,"status","direction","amount","uid"):
                      add("per_user_direction_"+t,t,"SELECT "+qident(dim)+" AS instrument,status,TRY_CAST(uid AS VARCHAR) AS uid,COUNT(*) AS records,SUM(CASE WHEN direction='deposit' THEN TRY_CAST(amount AS DOUBLE) WHEN direction='withdrawal' THEN -TRY_CAST(amount AS DOUBLE) ELSE NULL END) AS sample_net_native FROM "+qident(t)+" GROUP BY 1,2,3 ORDER BY 1,2,3")
                  if has(t,dim,"created_at","status"):
                      add("created_time_"+t,t,"SELECT "+qident(dim)+" AS instrument,status,COUNT(*) AS records,MIN(TRY_CAST(created_at AS TIMESTAMP)) AS first_created,MAX(TRY_CAST(created_at AS TIMESTAMP)) AS last_created FROM "+qident(t)+" GROUP BY 1,2 ORDER BY 1,2")
                  if has(t,"uid") and has("users","uid"):
                      add("uid_integrity_"+t,t,"WITH a AS (SELECT TRY_CAST(uid AS BIGINT) AS uid_key,COUNT(*) AS n FROM "+qident(t)+" GROUP BY 1), u AS (SELECT TRY_CAST(uid AS BIGINT) AS uid_key,COUNT(*) AS n FROM users GROUP BY 1) SELECT COUNT(*) AS tx_uid_groups,SUM(CASE WHEN u.uid_key IS NULL THEN a.n ELSE 0 END) AS unmatched_transactions,SUM(CASE WHEN u.n>1 THEN a.n ELSE 0 END) AS transactions_with_duplicate_user_key FROM a LEFT JOIN u USING(uid_key)")
                  if has(t,"status","completed_at"):
                      add("status_time_"+t,t,"SELECT status,COUNT(*) AS records,COUNT(completed_at) AS with_completed_at FROM "+qident(t)+" GROUP BY 1 ORDER BY 1")
              if has("users","uid"):
                  add("users_uid_uniqueness","users","SELECT COUNT(*) AS rows,COUNT(DISTINCT TRY_CAST(uid AS BIGINT)) AS unique_uid,COUNT(*)-COUNT(DISTINCT TRY_CAST(uid AS BIGINT)) AS missing_or_duplicated FROM users")
              if has("fiat_transactions","uid") and has("crypto_transactions","uid"):
                  add("cross_rail_cooccurrence","users + transactions","WITH f AS (SELECT TRY_CAST(uid AS BIGINT) AS uid,COUNT(*) AS n_fiat FROM fiat_transactions GROUP BY 1), c AS (SELECT TRY_CAST(uid AS BIGINT) AS uid,COUNT(*) AS n_crypto FROM crypto_transactions GROUP BY 1) SELECT f.uid,f.n_fiat,c.n_crypto FROM f JOIN c USING(uid) ORDER BY uid")
              if has("exchange_rates","asset","rate_to_usdt","effective_date"):
                  add("rate_coverage","exchange_rates","SELECT asset,COUNT(*) AS rows,COUNT(DISTINCT TRY_CAST(rate_to_usdt AS DOUBLE)) AS distinct_rates,MIN(TRY_CAST(effective_date AS DATE)) AS min_effective_date,MAX(TRY_CAST(effective_date AS DATE)) AS max_effective_date FROM exchange_rates GROUP BY 1 ORDER BY 1")
              # The next hypotheses are built only after observed schemas and the first completed read.
              if has("fiat_transactions","currency","amount","status","direction") and any(r["status"]=="completed" for r in out["raw_rows"]["fiat_transactions"]):
                  add("validated_native_net_fiat","fiat transactions","SELECT currency AS instrument,COUNT(*) AS records,SUM(CASE WHEN direction='deposit' THEN CAST(amount AS DOUBLE) ELSE 0 END) AS deposits_native,SUM(CASE WHEN direction='withdrawal' THEN CAST(amount AS DOUBLE) ELSE 0 END) AS withdrawals_native,SUM(CASE WHEN direction='deposit' THEN CAST(amount AS DOUBLE) WHEN direction='withdrawal' THEN -CAST(amount AS DOUBLE) ELSE NULL END) AS net_native FROM fiat_transactions WHERE status='completed' AND direction IN ('deposit','withdrawal') GROUP BY 1 ORDER BY 1")
                  add("fiat_leave_one_user_out","fiat transactions","WITH u AS (SELECT currency AS instrument,TRY_CAST(uid AS BIGINT) AS uid,SUM(CASE WHEN direction='deposit' THEN CAST(amount AS DOUBLE) WHEN direction='withdrawal' THEN -CAST(amount AS DOUBLE) ELSE NULL END) AS user_net_native FROM fiat_transactions WHERE status='completed' AND direction IN ('deposit','withdrawal') GROUP BY 1,2), totals AS (SELECT instrument,SUM(user_net_native) AS total_net_native FROM u GROUP BY 1) SELECT u.instrument,u.uid,u.user_net_native,t.total_net_native,t.total_net_native-u.user_net_native AS net_without_user FROM u JOIN totals t USING(instrument) ORDER BY u.instrument,ABS(u.user_net_native) DESC,u.uid")
              if has("crypto_transactions","asset","amount","status","direction") and any(r["status"]=="completed" for r in out["raw_rows"]["crypto_transactions"]):
                  add("validated_native_net_crypto","crypto transactions","SELECT asset AS instrument,COUNT(*) AS records,SUM(CASE WHEN direction='deposit' THEN CAST(amount AS DOUBLE) ELSE 0 END) AS deposits_native,SUM(CASE WHEN direction='withdrawal' THEN CAST(amount AS DOUBLE) ELSE 0 END) AS withdrawals_native,SUM(CASE WHEN direction='deposit' THEN CAST(amount AS DOUBLE) WHEN direction='withdrawal' THEN -CAST(amount AS DOUBLE) ELSE NULL END) AS net_native FROM crypto_transactions WHERE status='completed' AND direction IN ('deposit','withdrawal') GROUP BY 1 ORDER BY 1")
                  add("crypto_leave_one_user_out","crypto transactions","WITH u AS (SELECT asset AS instrument,TRY_CAST(uid AS BIGINT) AS uid,SUM(CASE WHEN direction='deposit' THEN CAST(amount AS DOUBLE) WHEN direction='withdrawal' THEN -CAST(amount AS DOUBLE) ELSE NULL END) AS user_net_native FROM crypto_transactions WHERE status='completed' AND direction IN ('deposit','withdrawal') GROUP BY 1,2), totals AS (SELECT instrument,SUM(user_net_native) AS total_net_native FROM u GROUP BY 1) SELECT u.instrument,u.uid,u.user_net_native,t.total_net_native,t.total_net_native-u.user_net_native AS net_without_user FROM u JOIN totals t USING(instrument) ORDER BY u.instrument,ABS(u.user_net_native) DESC,u.uid")
              if has("users","uid","account_status") and has("fiat_transactions","uid","status","direction","currency","amount","created_at"):
                  add("current_account_status_crosscheck","users and fiat transactions","SELECT u.account_status,f.currency,f.direction,f.status,COUNT(*) AS records,MIN(TRY_CAST(f.created_at AS TIMESTAMP)) AS first_created,MAX(TRY_CAST(f.created_at AS TIMESTAMP)) AS last_created,SUM(CAST(f.amount AS DOUBLE)) AS amount_native FROM fiat_transactions f JOIN users u ON TRY_CAST(f.uid AS BIGINT)=TRY_CAST(u.uid AS BIGINT) GROUP BY 1,2,3,4 ORDER BY 1,2,3,4")
              if has("exchange_rates","asset","effective_date") and has("fiat_transactions","currency","created_at") and has("crypto_transactions","asset","created_at"):
                  add("rate_observation_time_gap","all rails and reference rates","WITH tx AS (SELECT 'fiat' AS rail,currency AS instrument,TRY_CAST(created_at AS DATE) AS created_date FROM fiat_transactions UNION ALL SELECT 'crypto',asset,TRY_CAST(created_at AS DATE) FROM crypto_transactions), refs AS (SELECT asset,MAX(TRY_CAST(effective_date AS DATE)) AS last_rate_date,COUNT(*) AS n_rates FROM exchange_rates GROUP BY 1) SELECT tx.rail,tx.instrument,COUNT(*) AS tx_records,MIN(tx.created_date) AS first_tx_date,MAX(tx.created_date) AS last_tx_date,MAX(refs.last_rate_date) AS last_available_rate_date,COUNT(*) FILTER(WHERE tx.created_date>refs.last_rate_date) AS records_after_last_rate_date FROM tx LEFT JOIN refs ON tx.instrument=refs.asset GROUP BY 1,2 ORDER BY 1,2")
              if has("fiat_transactions","uid","created_at") and has("crypto_transactions","uid","created_at"):
                  add("cross_rail_minimum_time_gap","shared user only - no provenance inference","WITH fiat AS (SELECT TRY_CAST(uid AS BIGINT) uid,TRY_CAST(created_at AS TIMESTAMP) ts FROM fiat_transactions), crypto AS (SELECT TRY_CAST(uid AS BIGINT) uid,TRY_CAST(created_at AS TIMESTAMP) ts FROM crypto_transactions) SELECT fiat.uid,COUNT(*) AS possible_pairs,MIN(ABS(DATE_DIFF('minute',fiat.ts,crypto.ts))) AS closest_gap_minutes FROM fiat JOIN crypto USING(uid) GROUP BY 1 ORDER BY closest_gap_minutes,uid")
              def execute(item):
                  db=duckdb.connect("ontology-20261008.duckdb",read_only=True)
                  try:
                      cur=db.execute(item["sql"])
                      cols=[x[0] for x in cur.description]
                      res=[dict(zip(cols,map(ser,r))) for r in cur.fetchall()]
                      return {**item,"status":"PASS","row_count":len(res),"rows":res}
                  except Exception as e:
                      return {**item,"status":"FAIL","error":str(e)}
                  finally: db.close()
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
                  out["queries"]=list(ex.map(execute,qs))
              out["phase"]="done"
              out["checks"]=[{"name":"four_materializations","pass":len(out["materializations"])==4},{"name":"allowed_tables_only","pass":set(out["schemas"])==set(allowed)},{"name":"init_once","pass":len(out["init"])==4},{"name":"SQL_queries","pass":all(x["status"]=="PASS" for x in out["queries"])},{"name":"ontology_gate1_sources","pass":out["gate1"]["structural_source_status"]=="PASS_STRUCTURE_AND_SOURCE_ONLY"}]
              dump()
              print("ONTOLOGY_E2E_SUMMARY",json.dumps({"version":out["duckdb_version"],"phase":out["phase"],"counts":{x["table"]:x["count"] for x in out["materializations"]},"check_count":len(out["queries"]),"failures":[x["name"] for x in out["queries"] if x["status"]=="FAIL"]},ensure_ascii=False))
          except Exception as e:
              out["phase"]="blocked"
              out["error"]=repr(e)
              out["traceback"]=traceback.format_exc()
              dump()
              print("ONTOLOGY_E2E_BLOCKED",repr(e))
              traceback.print_exc()
              raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ontology-e2e-20261008-evidence
          path: ontology-e2e-20261008.json
          if-no-files-found: warn
