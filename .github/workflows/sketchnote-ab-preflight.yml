name: Sketchnote A/B Preflight

on:
  pull_request:
    paths:
      - 'skills/sketchnote-generator/**'
      - '.github/workflows/sketchnote-ab-preflight.yml'
  workflow_dispatch:

jobs:
  fail-closed-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolation harness logic
        run: python3 skills/sketchnote-generator/evals/isolated_ab.py self-test
      - name: Verify pinned source and distinct skill inputs
        run: |
          python3 skills/sketchnote-generator/evals/isolated_ab.py dry-run --candidate-ref HEAD > /tmp/sketchnote-ab-preflight.json
          python3 - <<'PY'
          import json
          p = json.load(open("/tmp/sketchnote-ab-preflight.json"))
          assert p["paired_requests"] == 6
          assert p["quality_status"] == "not_run"
          assert p["baseline_sha"] != p["candidate_sha"]
          print("PREFLIGHT ONLY: 6 pairs prepared; no API calls; quality review not performed")
          PY
