name: SQL Business Thinking Native DuckDB URL Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sql-business-thinking-native-duckdb-url-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d02-native-url:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Reject independent source-contract mutations
        shell: bash
        run: python skills/sql-business-thinking/tests/check_native_contract.py

      - name: Install DuckDB 1.4.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 \
            https://github.com/duckdb/duckdb/releases/download/v1.4.2/duckdb_cli-linux-amd64.zip \
            -o duckdb.zip
          unzip -q duckdb.zip
          chmod +x duckdb
          ./duckdb -version

      - name: Run exact read_xlsx URL contract
        shell: bash
        run: |
          set -euo pipefail
          cat > d02.sql <<'SQL'
          INSTALL httpfs;
          LOAD httpfs;
          INSTALL excel;
          LOAD excel;

          .mode csv
          CREATE TEMP TABLE users AS
          SELECT *
          FROM read_xlsx(
            'https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx',
            sheet = 'users',
            header = true
          );

          .once users.csv
          SELECT *
          FROM users;

          CREATE TEMP TABLE fiat_transactions AS
          SELECT *
          FROM read_xlsx(
            'https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx',
            sheet = 'fiat_transactions',
            header = true
          );

          .once fiat_transactions.csv
          SELECT *
          FROM fiat_transactions;

          CREATE TEMP TABLE crypto_transactions AS
          SELECT *
          FROM read_xlsx(
            'https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx',
            sheet = 'crypto_transactions',
            header = true
          );

          .once crypto_transactions.csv
          SELECT *
          FROM crypto_transactions;

          CREATE TEMP TABLE exchange_rates AS
          SELECT *
          FROM read_xlsx(
            'https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx',
            sheet = 'exchange_rates',
            header = true
          );

          .once exchange_rates.csv
          SELECT *
          FROM exchange_rates;
          SQL

          ./duckdb < d02.sql

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, pathlib, re, subprocess

          sheets = [
              "users",
              "fiat_transactions",
              "crypto_transactions",
              "exchange_rates",
          ]
          evidence = {
              "duckdb_version": subprocess.check_output(["./duckdb", "-version"], text=True).strip(),
              "source_url": "https://docs.google.com/spreadsheets/d/1YRLbfW3qCs2PjSjt87-gqWevgkNRGdRqB-21ngGDWSs/export?format=xlsx",
              "initialization": [
                  "INSTALL httpfs;",
                  "LOAD httpfs;",
                  "INSTALL excel;",
                  "LOAD excel;",
              ],
              "sheets": {},
          }

          sql_text = pathlib.Path("d02.sql").read_text()
          evidence["sql_sha256"] = hashlib.sha256(sql_text.encode()).hexdigest()
          assert sql_text.count("INSTALL httpfs;") == 1
          assert sql_text.count("LOAD httpfs;") == 1
          assert sql_text.count("INSTALL excel;") == 1
          assert sql_text.count("LOAD excel;") == 1
          assert sql_text.count("read_xlsx(") == 4
          assert sql_text.count("header = true") == 4
          assert sql_text.count("CREATE TEMP TABLE ") == 4, "source sheets must be materialized once"
          for sheet in sheets:
              assert sql_text.count(f"CREATE TEMP TABLE {sheet} AS") == 1
              assert f"FROM {sheet};" in sql_text, f"export must use materialized table: {sheet}"
          reads = re.findall(r"FROM read_xlsx\(\s*'([^']+)',\s*sheet\s*=\s*'([^']+)',\s*header\s*=\s*true\s*\)", sql_text)
          assert reads == [(evidence["source_url"], sheet) for sheet in sheets], "immutable URL/sheet/header contract violated"

          for sheet in sheets:
              path = pathlib.Path(f"{sheet}.csv")
              assert path.exists() and path.stat().st_size > 0, f"missing output: {path}"
              with path.open(newline="", encoding="utf-8") as fh:
                  rows = list(csv.reader(fh))
              assert rows, f"empty output: {sheet}"
              evidence["sheets"][sheet] = {
                  "columns": rows[0],
                  "row_count": max(len(rows) - 1, 0),
                  "csv_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          pathlib.Path("d02-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Independent XLSX roundtrip with derived expectations
        shell: bash
        run: |
          set -euo pipefail
          cat > holdout.sql <<'SQL'
          LOAD excel;
          CREATE TEMP TABLE holdout_source AS
          SELECT i::INTEGER AS sample_id,
                 CASE WHEN i % 2 = 0 THEN 'even' ELSE 'odd' END AS sample_group,
                 CAST(i * 1.25 AS DECIMAL(12, 2)) AS sample_amount
          FROM range(1, 12) AS t(i);

          COPY holdout_source TO 'holdout.xlsx'
          (FORMAT xlsx, SHEET 'Independent', HEADER true);

          CREATE TEMP TABLE holdout_materialized AS
          SELECT *
          FROM read_xlsx('holdout.xlsx', sheet = 'Independent', header = true);

          .mode csv
          .once holdout-result.csv
          WITH differences AS (
            (SELECT * FROM holdout_source EXCEPT ALL SELECT * FROM holdout_materialized)
            UNION ALL
            (SELECT * FROM holdout_materialized EXCEPT ALL SELECT * FROM holdout_source)
          )
          SELECT CASE
            WHEN (SELECT COUNT(*) FROM holdout_source) > 0
             AND (SELECT COUNT(*) FROM differences) = 0 THEN 'PASS'
            ELSE error('INDEPENDENT_XLSX_ROUNDTRIP_MISMATCH')
          END AS state;
          SQL
          ./duckdb < holdout.sql
          python - <<'PY'
          from pathlib import Path
          import csv
          with Path("holdout-result.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert rows == [{"state": "PASS"}], rows
          sql = Path("holdout.sql").read_text()
          assert sql.count("read_xlsx(") == 1
          assert sql.count("CREATE TEMP TABLE holdout_materialized AS") == 1
          print("PASS: independent XLSX roundtrip using bilateral EXCEPT ALL")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: sql-business-thinking-native-d02
          path: |
            d02.sql
            d02-evidence.json
            users.csv
            fiat_transactions.csv
            crypto_transactions.csv
            exchange_rates.csv
            holdout.sql
            holdout-result.csv
          if-no-files-found: error
