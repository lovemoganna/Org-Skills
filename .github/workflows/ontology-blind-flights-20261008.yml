name: Ontology Blind Flight Evidence
on:
  push:
    branches:
      - test/ontology-blind-flights-20261008
    paths:
      - .github/workflows/ontology-blind-flights-20261008.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-source-and-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed native DuckDB version
        run: python -m pip install duckdb==1.4.2
      - name: Download exact original CSV sources and record HTTP evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p blind-data blind-evidence
          BASE="https://web.stanford.edu/class/datasci112/data/nycflights13"
          for file in flights11.csv weather.csv planes.csv; do
            curl -fSL --retry 2 --connect-timeout 15 --max-time 90 -D "blind-evidence/${file}.headers" "$BASE/$file" -o "blind-data/$file"
            test -s "blind-data/$file"
          done
      - name: Execute blind schema, relation, signal and robustness queries
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, pathlib, duckdb
          root=pathlib.Path('blind-data')
          output=pathlib.Path('blind-evidence')
          base='https://web.stanford.edu/class/datasci112/data/nycflights13'
          manifest=[]
          for name in ['flights11.csv','weather.csv','planes.csv']:
              path=root/name
              raw=path.read_bytes()
              headers=(output/(name+'.headers')).read_text()
              blocks=[b for b in headers.replace('\r','').split('\n\n') if 'HTTP/' in b]
              final=blocks[-1].lower() if blocks else ''
              lengths=[int(line.split(':',1)[1].strip()) for line in final.splitlines() if line.startswith('content-length:')]
              length=lengths[-1] if lengths else None
              if not raw or (length is not None and len(raw)!=length):
                  raise RuntimeError('SOURCE_INCOMPLETE: '+name)
              with path.open(newline='',encoding='utf-8-sig') as stream:
                  header=next(csv.reader(stream))
              if not header or any(not h for h in header):
                  raise RuntimeError('CSV_HEADER_INVALID: '+name)
              manifest.append({'url':base+'/'+name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'http_content_length':length,'length_verified':length==len(raw) if length is not None else False,'columns':header})
          (output/'source-receipt.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False))
          con=duckdb.connect(':memory:')
          out={'duckdb':con.sql('SELECT version()').fetchone()[0],'sources':manifest,'checks':{},'results':{},'sql':{}}
          def run(name,sql):
              out['sql'][name]=sql
              rel=con.execute(sql)
              columns=[d[0] for d in rel.description]
              vals=[dict(zip(columns,row)) for row in rel.fetchall()]
              out['results'][name]=vals
              return vals
          for name,table in [('flights11.csv','flights'),('weather.csv','weather'),('planes.csv','planes')]:
              con.execute("CREATE TEMP TABLE "+table+" AS SELECT * FROM read_csv_auto('blind-data/"+name+"', HEADER=TRUE, SAMPLE_SIZE=-1)")
          run('counts','SELECT (SELECT COUNT(*) FROM flights) AS flights, (SELECT COUNT(*) FROM weather) AS weather, (SELECT COUNT(*) FROM planes) AS planes')
          for name in ['flights','weather','planes']:
              run('schema_'+name, 'DESCRIBE SELECT * FROM '+name)
          gate=json.loads(pathlib.Path('tests/ontology-constrained-analysis/blind-flights-gate1.json').read_text(encoding='utf-8'))
          atoms=gate['atomic_knowledge']
          rules=gate['recognition_rules']
          if len(atoms)!=len({x['id'] for x in atoms}) or not atoms or not rules:
              raise RuntimeError('GATE1_INVALID_ATOMS_OR_RULES')
          if any(not all(x.get(k) for k in ['l1','l2','l3','name','subject','grain','source','time']) for x in atoms):
              raise RuntimeError('GATE1_INCOMPLETE_ATOM_FIELDS')
          if any(not all(x.get(k) for k in ['l1','l2','l3','recognition','lisp','definition','state']) for x in rules):
              raise RuntimeError('GATE1_INCOMPLETE_RULE_FIELDS')
          if not gate['relations'] or any(s.count('|')!=2 for s in gate['relations']):
              raise RuntimeError('GATE1_RELATION_TRIPLES_INVALID')
          out['gate1']={'status':'STRUCTURE_PASS_SEMANTIC_AUDIT_SEPARATE','atoms':len(atoms),'rules':len(rules),'relations':len(gate['relations'])}
          run('sample_month_scope','SELECT year,month,COUNT(*) AS flights FROM flights GROUP BY 1,2 ORDER BY 1,2')
          run('native_semantics','SELECT MIN(year) AS min_year, MAX(year) AS max_year, COUNT(*) FILTER (WHERE dep_delay IS NOT NULL) AS delays_known, COUNT(*) FILTER (WHERE dep_delay IS NULL) AS delays_missing, COUNT(*) FILTER (WHERE hour IS NOT NULL) AS scheduled_hour_known FROM flights')
          flight_cols={r['column_name'] for r in out['results']['schema_flights']}
          weather_cols={r['column_name'] for r in out['results']['schema_weather']}
          plane_cols={r['column_name'] for r in out['results']['schema_planes']}
          required={'origin','month','hour','dep_delay'}
          missing=sorted(required-flight_cols)
          if missing:
              raise RuntimeError('FLIGHT_REQUIRED_FIELDS_ABSENT:'+','.join(missing))
          weather_keys={'airport','year','month','day','hour'}
          if not weather_keys.issubset(weather_cols):
              out['checks']['weather_relation_status']='BLOCKED_MISSING_KEYS'
              out['checks']['weather_missing_keys']=sorted(weather_keys-weather_cols)
          else:
              weather_duplicates=run('weather_key_uniqueness',
                  'SELECT COUNT(*) AS duplicated_keys FROM (SELECT airport,year,month,day,hour FROM weather GROUP BY 1,2,3,4,5 HAVING COUNT(*)>1)')[0]['duplicated_keys']
              run('weather_station_codes','SELECT airport AS station_code,COUNT(*) AS readings FROM weather GROUP BY 1 ORDER BY 1')
              run('flight_origin_codes','SELECT origin AS origin_code,COUNT(*) AS flights FROM flights GROUP BY 1 ORDER BY 1')
              if weather_duplicates:
                  out['checks']['weather_relation_status']='BLOCKED_JOIN_FANOUT'
              else:
                  out['checks']['weather_relation_status']='KEYS_UNIQUE_TIME_SEMANTICS_PENDING'
                  out['checks']['weather_time_semantics']='flights.hour is scheduled local hour; weather.hour observation timezone unverified: cross-table business join deferred'
          if 'tailnum' in flight_cols and 'tailnum' in plane_cols:
              plane_duplicates=run('plane_key_uniqueness',
                  'SELECT COUNT(*) AS duplicated_tailnums FROM (SELECT tailnum FROM planes WHERE tailnum IS NOT NULL GROUP BY 1 HAVING COUNT(*)>1)')[0]['duplicated_tailnums']
              out['checks']['plane_relation_status']='READY' if plane_duplicates==0 else 'BLOCKED_JOIN_FANOUT'
              if plane_duplicates==0:
                  run('flight_plane_coverage',
                      'SELECT COUNT(*) AS flights, COUNT(p.tailnum) AS matched_plane_rows, COUNT(*) FILTER (WHERE f.tailnum IS NULL) AS no_tailnum FROM flights f LEFT JOIN planes p ON f.tailnum=p.tailnum')
          else:
              out['checks']['plane_relation_status']='BLOCKED_NO_JOIN_KEY'
          run('flight_hour_rates',"""SELECT hour AS scheduled_hour, COUNT(*) AS flights,
              COUNT(*) FILTER (WHERE dep_delay>0) AS late_departures,
              ROUND(100.0*COUNT(*) FILTER (WHERE dep_delay>0)/COUNT(*),2) AS late_share_pct,
              ROUND(AVG(dep_delay),2) AS mean_delay_min
              FROM flights WHERE dep_delay IS NOT NULL AND hour BETWEEN 0 AND 23
              GROUP BY 1 ORDER BY 1""")
          con.execute("""CREATE TEMP VIEW period_flights AS
              SELECT origin, month, carrier, dep_delay,
              CASE WHEN hour BETWEEN 6 AND 11 THEN '06-11'
                   WHEN hour BETWEEN 18 AND 23 THEN '18-23'
                   ELSE NULL END AS period
              FROM flights WHERE dep_delay IS NOT NULL
              AND (hour BETWEEN 6 AND 11 OR hour BETWEEN 18 AND 23)""")
          run('period_compare',"""SELECT period,COUNT(*) AS flights,
               COUNT(*) FILTER (WHERE dep_delay>0) AS late_departures,
               ROUND(100.0*COUNT(*) FILTER (WHERE dep_delay>0)/COUNT(*),2) AS late_share_pct,
               ROUND(AVG(dep_delay),2) AS mean_delay_minutes,
               ROUND(MEDIAN(dep_delay),2) AS median_delay_minutes
               FROM period_flights GROUP BY 1 ORDER BY 1""")
          run('origin_period',"""SELECT origin,period,COUNT(*) AS flights,
               ROUND(100.0*COUNT(*) FILTER (WHERE dep_delay>0)/COUNT(*),2) AS late_share_pct
               FROM period_flights GROUP BY 1,2 ORDER BY 1,2""")
          run('month_origin_standardized',"""WITH strata AS(
               SELECT origin,month,
               COUNT(*) FILTER (WHERE period='06-11') AS early_n,
               COUNT(*) FILTER (WHERE period='18-23') AS evening_n,
               COUNT(*) FILTER (WHERE period='06-11' AND dep_delay>0)::DOUBLE/NULLIF(COUNT(*) FILTER (WHERE period='06-11'),0) AS early_rate,
               COUNT(*) FILTER (WHERE period='18-23' AND dep_delay>0)::DOUBLE/NULLIF(COUNT(*) FILTER (WHERE period='18-23'),0) AS evening_rate
               FROM period_flights GROUP BY 1,2)
               SELECT COUNT(*) AS comparable_strata,
               SUM(early_n+evening_n) AS flights_in_comparable_strata,
               ROUND(100.0*SUM((early_n+evening_n)*(evening_rate-early_rate))/SUM(early_n+evening_n),2) AS weighted_evening_minus_morning_pp,
               COUNT(*) FILTER (WHERE evening_rate>early_rate) AS evening_higher_strata,
               COUNT(*) FILTER (WHERE evening_rate<early_rate) AS morning_higher_strata
               FROM strata WHERE early_n>0 AND evening_n>0""")
          run('late_tail_sensitivity',"""WITH cutoff AS(
               SELECT QUANTILE_CONT(dep_delay,0.99) AS p99 FROM period_flights),
               limited AS (SELECT p.* FROM period_flights p CROSS JOIN cutoff WHERE p.dep_delay<=cutoff.p99)
               SELECT period,COUNT(*) AS flights,
               ROUND(100.0*COUNT(*) FILTER (WHERE dep_delay>0)/COUNT(*),2) AS late_share_pct,
               ROUND(AVG(dep_delay),2) AS mean_delay_minutes
               FROM limited GROUP BY 1 ORDER BY 1""")
          run('origin_carrier_standardized',"""WITH strata AS(
              SELECT origin,carrier,
              COUNT(*) FILTER (WHERE period='06-11') AS early_n,
              COUNT(*) FILTER (WHERE period='18-23') AS evening_n,
              COUNT(*) FILTER (WHERE period='06-11' AND dep_delay>0)::DOUBLE/NULLIF(COUNT(*) FILTER (WHERE period='06-11'),0) AS early_rate,
              COUNT(*) FILTER (WHERE period='18-23' AND dep_delay>0)::DOUBLE/NULLIF(COUNT(*) FILTER (WHERE period='18-23'),0) AS evening_rate
              FROM period_flights GROUP BY 1,2)
              SELECT COUNT(*) AS comparable_strata,
              SUM(early_n+evening_n) AS flights_in_comparable_strata,
              ROUND(100.0*SUM((early_n+evening_n)*(evening_rate-early_rate))/SUM(early_n+evening_n),2) AS weighted_evening_minus_morning_pp,
              COUNT(*) FILTER (WHERE evening_rate>early_rate) AS evening_higher_strata,
              COUNT(*) FILTER (WHERE evening_rate<early_rate) AS morning_higher_strata
              FROM strata WHERE early_n>0 AND evening_n>0""")
          path=output/'blind-analysis-results.json'
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2,default=str))
          (output/'blind-analysis-sql.sql').write_text('\n\n'.join('-- '+k+'\n'+v.rstrip(';')+';' for k,v in out['sql'].items()))
          printable={'duckdb':out['duckdb'],'sources':[{'url':s['url'],'bytes':s['bytes'],'sha256':s['sha256'],'length_verified':s['length_verified']} for s in manifest],
          'checks':out['checks'],'gate1':out['gate1'],'results':{k:v for k,v in out['results'].items() if not k.startswith('schema_') and k!='airport_month'}}
          print('BLIND_ANALYSIS_JSON='+json.dumps(printable,ensure_ascii=False,default=str))
          if missing:
              raise SystemExit('FLIGHT_SCHEMA_BLOCKED')
          PY
      - name: Upload raw receipts and SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-blind-flight-evidence
          path: blind-evidence/
          if-no-files-found: warn
