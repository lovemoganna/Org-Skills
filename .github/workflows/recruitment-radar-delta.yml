name: Recruitment radar delta tests
on:
  pull_request:
    paths:
      - "tools/recruitment_radar/**"
      - ".github/workflows/recruitment-radar-delta.yml"
  push:
    paths:
      - "tools/recruitment_radar/**"
      - ".github/workflows/recruitment-radar-delta.yml"
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tools/recruitment_radar -p "test_*.py" -v
