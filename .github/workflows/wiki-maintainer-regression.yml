name: Wiki Maintainer Regression
on:
  push:
    paths:
      - 'skills/llm-wiki-maintainer/**'
      - '.github/workflows/wiki-maintainer-regression.yml'
  pull_request:
    paths:
      - 'skills/llm-wiki-maintainer/**'
      - '.github/workflows/wiki-maintainer-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic contradiction, idempotency and concurrency contract
        run: python3 skills/llm-wiki-maintainer/tests/check_conflict_contract.py
