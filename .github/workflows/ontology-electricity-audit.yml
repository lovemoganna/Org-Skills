name: Ontology Electricity DuckDB Audit
on:
  push:
    branches:
      - analysis/electricity-load-20261008
    paths:
      - .github/workflows/ontology-electricity-audit.yml
      - skills/ontology-constrained-analysis/scripts/electricity_case_runner.py
      - skills/ontology-constrained-analysis/scripts/source_gate.py
      - skills/ontology-constrained-analysis/SKILL.md
      - skills/ontology-constrained-analysis/references/runtime.md
permissions:
  contents: write
jobs:
  electricity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout controlled test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.2
      - name: Verify exact GitHub blob fallback and source hash
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile skills/ontology-constrained-analysis/scripts/source_gate.py
          python - <<'PY'
          import json
          from pathlib import Path
          m = {"files": [{"name": "LD2011_2014.txt",
                "url": "https://raw.githubusercontent.com/movingpictures83/Electricity/main/LD2011_2014.txt",
                "git_blob_sha": "9027e543ffee8cc4295773fd691b57bd5888318c",
                "sha256": "c765fe5543010d52f0c0622e424b9923e3851580c5ecf61c7ed6c99be2be155a"}]}
          Path("/tmp/electricity-manifest.json").write_text(json.dumps(m))
          PY
          ONTOLOGY_SOURCE_PREFER_GITHUB_BLOB=1 python \
            skills/ontology-constrained-analysis/scripts/source_gate.py \
            --manifest /tmp/electricity-manifest.json \
            --out /tmp/electricity-github-blob-source --timeout 120
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/electricity-github-blob-source/source_gate_receipt.json").read_text())
          f=r["results"][0]
          assert r["complete"] and f["status"]=="BYTES_VERIFIED"
          assert f["bytes"]==30363176
          assert f["transport"]=="github_git_blob_api"
          assert f["git_blob_sha"]=="9027e543ffee8cc4295773fd691b57bd5888318c"
          Path("reports/electricity-20261008").mkdir(parents=True,exist_ok=True)
          Path("reports/electricity-20261008/github_blob_source_receipt.json").write_text(
              json.dumps(r,ensure_ascii=False,indent=2))
          print("SAME_SOURCE_GITHUB_BLOB_GATE: PASS",f["bytes"],f["sha256"])
          PY
      - name: Fetch exact TXT and execute real DuckDB report
        shell: bash
        run: |
          set +e
          python skills/ontology-constrained-analysis/scripts/electricity_case_runner.py
          status=$?
          echo "analysis_exit_code=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Verify static HTML browser compatibility
        if: always()
        shell: bash
        run: |
          test -f reports/electricity-20261008/analysis_report.html || exit 0
          python - <<'PY'
          from pathlib import Path
          h=Path('reports/electricity-20261008/analysis_report.html').read_text()
          assert h.count('<pre><code>')>=10
          assert '<script src=' not in h and '<link rel="stylesheet"' not in h
          assert 'function copySQL(' in h
          print('HTML_AUDIT: PASS, no external JS/CSS/WASM or fetch dependencies')
          PY
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom "file://$PWD/reports/electricity-20261008/analysis_report.html" > /tmp/electricity-report-dom.html 2>/tmp/browser.stderr
            grep -q '电力负荷' /tmp/electricity-report-dom.html
            echo 'BROWSER_FILE_ORIGIN_SMOKE_TEST: PASS'
          else
            echo 'BROWSER_FILE_ORIGIN_SMOKE_TEST: CHROME_UNAVAILABLE, static audit only'
          fi
          python - <<'PY'
          import json, re
          from pathlib import Path
          dom = Path('/tmp/electricity-report-dom.html')
          text = dom.read_text(errors='replace') if dom.exists() else ''
          match = re.search(r'data-runtime-origin="([^"]+)"', text)
          rec = {
              "report_mode": "offline single HTML",
              "browser_origin": match.group(1) if match else "NOT_TESTED",
              "chrome_available": bool(dom.exists()),
              "browser_html_rendered": "电力负荷" in text,
              "remote_fetch_required": False,
              "cors_required": False,
              "duckdb_wasm_used": False,
              "sql_highlight_static_checked": True,
              "clipboard_user_action_tested": False
          }
          Path('reports/electricity-20261008/browser_gate_receipt.json').write_text(
              json.dumps(rec, indent=2, ensure_ascii=False))
          print('BROWSER_GATE:', rec)
          PY
      - name: Commit audit output to branch
        if: always()
        shell: bash
        run: |
          git config user.name "ontology-analysis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d reports/electricity-20261008 ]; then
            find reports/electricity-20261008 -maxdepth 1 -type f ! -name 'LD2011_2014.txt' -print0 | xargs -0 -r git add -f --
            git add -u -- reports/electricity-20261008
            if ! git diff --cached --quiet; then
              git commit -m "results: record actual single-source DuckDB electricity audit"
              git push origin HEAD:analysis/electricity-load-20261008
            fi
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electricity-duckdb-audit
          path: |
            reports/electricity-20261008/*.html
            reports/electricity-20261008/*.md
            reports/electricity-20261008/*.json
          if-no-files-found: warn
      - name: Enforce execution status
        if: always()
        shell: bash
        run: |
          test "${analysis_exit_code}" = "0"
