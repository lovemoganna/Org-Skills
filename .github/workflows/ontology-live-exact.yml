name: Ontology Live Exact SQL Source Test
on:
  push:
    branches: ['test/ontology-exact-source-20261008']
    paths: ['.github/workflows/ontology-live-exact.yml','skills/ontology-constrained-analysis/live-tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.4.2 pandas
      - name: Run original SQL verbatim and materialize returned batches once
        run: python skills/ontology-constrained-analysis/live-tests/source_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-source-evidence
          path: evidence/
          if-no-files-found: warn
