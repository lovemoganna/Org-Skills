name: Ontology Source Gate Regression

on:
  push:
    branches: [main]
    paths:
      - "skills/ontology-constrained-analysis/**"
      - ".github/workflows/ontology-source-gate-check.yml"
  pull_request:
    paths:
      - "skills/ontology-constrained-analysis/**"
      - ".github/workflows/ontology-source-gate-check.yml"

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run isolated source gate regressions
        run: |
          python -m py_compile skills/ontology-constrained-analysis/scripts/source_gate.py
          python skills/ontology-constrained-analysis/tests/check_repo.py
