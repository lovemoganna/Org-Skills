name: Legion Mode candidate contract

on:
  pull_request:
    paths:
      - 'skills/loop/router_v2/**'
      - 'skills/skill-router/SKILL.md'
      - '.github/workflows/legion-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install "openpyxl>=3.1,<4"
      - name: Legion runtime, adapter and recovery contracts
        run: |
          node --test skills/loop/router_v2/tests/*.js
          python3 -m unittest discover -s skills/loop/router_v2/tests -p 'test_*.py'
      - name: Router V2 backward compatibility
        run: |
          python3 skills/loop/router_v2/tests.py
          python3 skills/loop/router_v2/test_host_bridge.py
          node --test skills/loop/router_v2/test_work_host.js
